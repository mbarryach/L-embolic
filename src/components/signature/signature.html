    <h2 class="display signature__title">
      <span class="display__mask"><span class="display__line" data-i18n="signature_title_1">D'una copa</span></span>

        ><span class="display__line display__line--indent" data-i18n="signature_title_2">a l'altra.</span></span

    <!--
      Aqui no hay imagen: la que se ve es la del fondo, que en esta seccion

    -->

      <div class="signature__label" data-label="cocotro">
        <p class="signature__name">Cocotro</p>
        <p class="signature__recipe" data-i18n="recipe_cocotro">
          Ron, suc de pinya, suc de taronja, sirope de coco, granadina
        </p>
      </div>
      <div class="signature__label" data-label="tiki">

        <p class="signature__recipe" data-i18n="recipe_tiki">Ron, puré de fruites del bosc, suc de llima, sucre</p>
      </div>
    </div>

</section>
