<section class="hero" id="top" data-scene="hero">
  <div class="hero__grid grid">
    <p class="scene-mark hero__mark">
      <span class="scene-mark__index">01</span> <span data-i18n="hero_scene">la barra</span>
    </p>

    <p class="hero__edition" aria-hidden="true" data-i18n="hero_edition">Cocteleria · Cambrils · 2026</p>

    <h1 class="hero__title">
      <span class="visually-hidden" data-i18n="hero_hidden">L'embolic — cocteleria i torrades a Cambrils</span>
      <svg class="neon" viewBox="0 0 1000 250" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
        <!-- Un tspan por letra para poder encenderlas de una en una.
             OJO: van todas pegadas en la misma linea. En SVG, un salto de
             linea entre tspans se pinta como un espacio de verdad y el
             rotulo saldria "l ' e m B o l i c". De ahi el prettier-ignore. -->
        <!-- prettier-ignore -->
        <text class="neon__word" x="6" y="188" data-neon-word><tspan>l</tspan><tspan>'</tspan><tspan>e</tspan><tspan>m</tspan><tspan>B</tspan><tspan>o</tspan><tspan>l</tspan><tspan>i</tspan><tspan>c</tspan></text>
      </svg>
    </h1>

    <p class="hero__tagline hand" data-i18n="hero_tagline">el caos més divertit</p>

    <!-- Un embolic dibujado, convertit en signatura de la casa. -->
    <svg class="hero__doodle" viewBox="0 0 110 120" aria-hidden="true" focusable="false">
      <circle cx="34" cy="26" r="11" />
      <path d="M36 38 C 56 48, 66 68, 61 93 C 57 112, 76 120, 96 114" />
      <path d="M15 19 Q 34 3, 55 14 L 50 33 Q 32 24, 20 33 Z" />
      <path d="M36 38 C 20 52, 14 76, 26 96" />
    </svg>

    <div class="hero__foot">
      <p class="hero__sub lead" data-i18n="hero_sub">
        Cocteleria &amp; torrades a la Rambla de Cambrils. Còctels amb caràcter, una barra íntima i molta gràcia.
      </p>
      <div class="hero__cta">
        <a class="btn btn--primary" href="#carta" data-magnetic>
          <span data-i18n="hero_menu">Veure la carta</span>
          <svg class="btn__icon icon-line" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M2 8h12M9 3l5 5-5 5" />
          </svg>
        </a>
        <a
          class="btn btn--ghost"
          href="https://wa.me/34649982250"
          target="_blank"
          rel="noopener noreferrer"
          data-whatsapp
          data-magnetic
          data-i18n="hero_whatsapp"
          >WhatsApp</a
        >
      </div>
    </div>

    <div class="scroll-cue" aria-hidden="true">
      <span class="scroll-cue__label" data-i18n="hero_scroll">desplaça</span>
      <span class="scroll-cue__bar"></span>
    </div>
  </div>
