<div
  class="age-gate"
  data-age-gate
  role="dialog"
  aria-modal="true"
  aria-labelledby="age-gate-title"
  aria-describedby="age-gate-note"
  hidden
>
  <div class="age-gate__panel">
    <p class="age-gate__brand" aria-hidden="true">l'embolic</p>

    <span class="age-gate__rule" aria-hidden="true"></span>

    <h2 class="age-gate__title" id="age-gate-title" data-i18n="age_title">Ets major de 18 anys?</h2>

    <p class="age-gate__note" id="age-gate-note" data-i18n="age_note">
      Aquesta web mostra begudes alcohòliques. Cal ser major d'edat per entrar-hi.
    </p>

    <div class="age-gate__actions">
      <button class="btn btn--primary age-gate__yes" type="button" data-age-yes data-i18n="age_yes">
        Sí, tinc 18 anys o més
      </button>
      <button class="btn btn--ghost age-gate__no" type="button" data-age-no data-i18n="age_no">No</button>
    </div>

    <p class="age-gate__legal" data-i18n="age_legal">Beveu amb moderació.</p>
  </div>
</div>
